sections:
  - type: prose
    paragraphs:
      - "Gather 'round, jewel thieves of the heart and anyone who has ever smiled at a present and thought, what have I done to deserve this? You're cordially invited to **Foxy's White Elephant Christmas**, a black-and-gold party in **December 2026**. The day is still being sealed in wax — **date TBD** — and the hour will be announced once the dining room is promised."
      - "You do **not** need to bring a gift. The presents are provided. A **flat of abandoned packages** — ordered by strangers, never collected, contents unknown even to us — **is** the White Elephant. That flat is the entire gift pool. There is no second pile, and nothing for you to wrap at home."
      - "Whatever package you end up with, you must **create a story**. Tell the table **who originally ordered it** and **why it is important**. Funny, dramatic, or magnificently absurd. The wrapping is a mystery. The biography is your invention."
      - "Whether you come to steal, to be stolen from, or simply to eat something glittering by candlelight, there is a chair for you. [Claim a package](rsvp) from the flat when you RSVP — one per player — so we know you are in the game. A dish is welcome. A present from your closet is not."
  - type: actions
    links:
      - label: "RSVP & Claim a Mystery Package!"
        to: rsvp
  - type: steps
    heading: "The Flat Is the Gift Pool"
    lead: "How the White Elephant works:"
    image: /images/christmas-2026/emblem.webp
    imageAlt: "Gold art deco portrait of a fox in a top hat and bow tie beside a stack of sealed black-and-gold presents, holly, and mistletoe"
    imageWidth: 1024
    imageHeight: 1024
    paragraphs:
      - "Every gift in the game comes from the **flat of abandoned packages**. We are getting the flat. You are not shopping for a joke present, and you are not bringing a wrapped gift. If a well-meaning package from home tries to join the pile, it will be admired and then asked to sit out."
      - "**Your Mission:** [Claim a mystery package](rsvp) on the signup sheet if you are playing. That column is how you take a place in the pool. The gift itself is already in the flat."
    steps:
      - label: "Claim"
        text: "On the RSVP sheet, say you are in for a package from the flat. One gift per player. If you forget, one may still find you."
      - label: "Draw"
        text: "Numbers are drawn as you come in. Lower numbers go first and live with the consequences."
      - label: "Open or Steal"
        text: "On your turn, take a sealed package from the flat or steal one that is already open."
      - label: "Three Steals"
        text: "A gift may be stolen three times. After the third steal it is locked, and the person holding it has to look pleased."
      - label: "The Last Word"
        text: "When the final player sits down, the first player may steal once more — or keep whatever the flat handed them."
      - text: "The package nobody wants becomes the legend of the night. Do not apologize for it."
  - type: steps
    heading: "Who Ordered It, and Why It Matters"
    lead: "The story you owe the room:"
    paragraphs:
      - "The moment a package is truly yours — locked to you, or still in your hands when the stealing stops — you must give it a past. Who originally ordered this thing, and why was it important enough to send for? A spurned heiress, a nervous inventor, a person who lost a bet with a fox: all are acceptable ancestors."
      - "Funny, dramatic, or absurd. Commit. You may not shrug and say you do not know. You may say something gloriously untrue."
    steps:
      - label: "Who"
        text: "Name the person who originally ordered it. They do not have to be real. They do have to be specific."
      - label: "Why"
        text: "Say why it mattered — a feud, a romance, a misunderstanding, or a destiny."
      - label: "Tell It"
        text: "Deliver the story at the table, while the room is watching. One glittering sentence can be enough. A short scene is better."
      - text: "If the package is stolen before it locks, the story belongs to whoever ends up with it. The first tale does not have to travel with the box."
  - type: menu
    heading: "Sample Menu Highlights:"
    image: /images/christmas-2026/packages.webp
    imageAlt: "A ruby cocktail in cut crystal, chocolate truffles and peppermint bark on a gold tray, and a kraft package spilling gold ribbon, ringed with holly"
    imageWidth: 1152
    imageHeight: 864
    intro: "Dress like the ornament you mean to be. We're turning the dining room into a winter salon: candlelight, cut crystal, and a supper glamorous enough to survive a round of theft and a second round of curiosity."
    items:
      - "\"Standing Rib Roast with a Gold-Leaf Confidence Problem\""
      - "\"Brown-Butter Brussels, Hazelnuts, and No Apologies\""
      - "\"Potato Gratin Layered Like a Well-Kept Secret\""
      - "\"Cranberry-Glazed Carrots in Their Evening Wear\""
      - "\"Yorkshire Pudding, Puffed and Slightly Smug\""
      - "\"Citrus Salad with Pomegranate and a Sharp Opinion\""
      - "\"Dark Chocolate Yule Log, the Gift Everyone Actually Claims\""
  - type: prose
    paragraphs:
      - "Bringing a dish? Wonderful! [Sign up here](rsvp) to claim your plate and avoid four stuffings and no roast."
  - type: cocktail
    name: "Unclaimed Coupe"
    description: "gin, crème de cassis, a barspoon of dry vermouth, and a splash of pomegranate, shaken until it blushes and served in cut crystal with a sugared cranberry. It looks like a secret and drinks like a toast. Guaranteed to make every guest at the table feel like they drew the good one."
  - type: callout
    heading: "Did You Know?"
    paragraphs:
      - "The White Elephant takes its name from a legend about rare, expensive, and spectacularly inconvenient presents — the sort of gift that looks like an honor and eats like a responsibility. Ours arrive as a flat of abandoned packages: boxes with no card and no one left to explain the order. That explaining is your privilege. We are simply giving the tradition better lighting, a fox in a top hat, and a table that refuses to be sensible."
  - type: callout
    heading: "The Date Is Still Under Wraps"
    paragraphs:
      - "The party is a **December 2026** evening. The day itself is **TBD**, and so is the hour the doors open. We will not put a calendar hold on a night we have not promised. When the date is sealed, this page will say so, and a proper calendar card will appear here."
      - "Until then, [RSVP](rsvp) to claim your seat and a mystery package from the flat. You still do not need to bring a gift. We will write when the doors have an hour."
  - type: rsvp
    heading: "RSVP to Foxy's White Elephant Christmas!"
    kicker: "Packages, Pilfering & Pomegranate"
    paragraphs:
      - "Join us for a glowing December evening — **date TBD**, and worth clearing the month for."
      - "Whether you come to steal a package from the flat, invent who ordered it, or simply sit near the roast until someone else is brave, the table has room. You do not need to bring a gift. Come ready to laugh, eat, and lie beautifully about why the thing in your hands matters."
  - type: callout
    heading: "Special Requests"
    paragraphs:
      - "Got dietary restrictions, a hard no on peppermint, or a guest who considers the yule log its own food group? Tell us in your RSVP. The mystery packages stay mysterious. The menu can flex."
  - type: prose
    rule: true
    paragraphs:
      - "Don't miss the theft, or the testimony. Our gatherings are legendary, and this Christmas promises to be our most glittering, larcenous, and inventively untrue yet."
  - type: actions
    links:
      - label: "Reserve Your Seat!"
        to: rsvp
      - label: "See FAQs"
        to: faq
