# One file = one party. The filename is the URL: /events/christmas-2026
# Home shows the earliest party whose date is today or later.
# Times are wall-clock in the zone from src/config.ts.
# The day after `date`, the next build lists it in the Archive. See README.md.
#
# The evening is TBD. `date` is a December placeholder after Thanksgiving so
# Home stays Thanksgiving through November 26, then this party can take over.
# `time` and `endTime` are required by the schema; they are not a published
# hold. Leave showCalendar off until the day and hour are real.
# rsvpUrl is the Thanksgiving sheet for now. Add a Christmas tab's #gid= when it exists.

title: "Foxy's White Elephant Christmas: Abandoned Packages, Dubious Treasures, and the Gift Nobody Claims!"
date: "2026-12-20"
dateLabel: "December 2026 — Date TBD"
time: "18:00"
endTime: "22:00"
doors: "TBD"
summary: "A black-and-gold White Elephant Christmas with a gift swap, a flat of abandoned mystery packages, and a table set for anyone brave enough to open them."
rsvpUrl: "https://docs.google.com/spreadsheets/d/1a-KkhFHaeCP966Ak75BzxpR5PX4f3BLOmeK2XYbZXOU/edit?usp=sharing"
rsvpLabel: "RSVP & Claim a Mystery Package!"
location: "Foxy's Dinner Party"
