  - type: callout
    heading: "Did You Know?"
    paragraphs:
      - "Thanksgiving became a fixed national holiday in the middle of the nineteenth century, but the long table is older than the proclamation: harvest suppers, too much food, and a toast that runs long. From church-basement turkey to crystal coupes, the tradition has always been about making the people you love feel fed and fussed over. So whether your thanks is heartfelt or a little cheeky, your plate is part of a long history of celebrating abundance — and pretending you still have room for pie."
  - type: callout
    heading: "Mark Your Calendar:"
    showCalendar: true
    paragraphs:
