sections:
  - type: prose
    paragraphs:
      - "Gather 'round, hungry hearts and lucky leftovers! You're cordially invited to our annual, fabulous Thanksgiving Day dinner party on **Thursday, November 26, 2026**. Doors open at **5:00 PM** for an evening of candlelight, cousins, and carbohydrates we will not be apologizing for."
      - "Prepare for a night packed with hearty laughter, second helpings, and the finest company this side of the gravy boat. This year, we're unveiling our brand-new game: **Thanks, With Receipts** show-and-tell! Bring a photo, a keepsake, or a story that proves what you're grateful for — and, if you're brave, the family tale that still makes the table lose it. Whether it's a legendary toast, an unforgettable kitchen mishap, or a perfectly awkward blessing, get ready to share the love, the laughs, and the pie."
      - "Whether you're celebrating with your people, borrowing ours, or simply in need of a chair and a warm plate, there's always an extra seat — and definitely extra gravy — for you."
