  - type: prose
    paragraphs:
      - "Gather 'round, loved ones and lucky survivors! You're cordially invited to our annual, fabulous Mother's Day dinner party on **Saturday, May 9th, 2026**. Doors open at **5 PM** for an evening of springtime sparkle and family-fueled fun."
      - "Prepare for a night packed with hearty laughter, sweet memories, and the finest company this side of Mom's patience. This year, we're unveiling our brand-new game: **Mom's Most Embarrassing Moments** show-and-tell! Bring a funny childhood photo or a story about something your mom said or did that still makes the family crack up. Whether it’s a legendary quote, an unforgettable mishap, or a perfectly awkward parenting moment, get ready to share the love and the laughs."
      - "Whether you're celebrating your mom, your grandma, your aunt, or the incredible mother figure who helped shape you, there's always an extra seat — and definitely extra love — for you."
